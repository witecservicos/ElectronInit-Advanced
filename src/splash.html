<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiwitrack Escola - Chargement</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            /* Bleu nuit élégant */
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-container {
            position: relative;
            margin-bottom: 20px;
        }

        /* Effet de lueur derrière le logo */
        .logo-container::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, #3b82f6, #10b981);
            border-radius: 50%;
            z-index: -1;
            filter: blur(15px);
            opacity: 0.6;
            animation: pulse 2s infinite alternate;
        }

        img.logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
            background: #ffffff;
            padding: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        p.subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        /* Barre de chargement moderne */
        .loader-bar {
            width: 200px;
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #3b82f6, #10b981, transparent);
            animation: loading 1.5s infinite linear;
        }

        @keyframes loading {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        @keyframes pulse {
            0% {
                opacity: 0.4;
                transform: scale(0.95);
            }

            100% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .status-text {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Logo de l'application -->
        <div class="logo-container">
            <img src="../build/wiEscola-logo.png" alt="Wiwitrack Logo" class="logo">
        </div>

        <!-- Titre et sous-titre -->
        <h1>WIWITRACK ESCOLA & CRECHE</h1>
        <p class="subtitle">Système de Gestion Scolaire Local-First</p>

        <!-- Barre de progression animée -->
        <div class="loader-bar"></div>

        <!-- Texte d'état dynamique -->
        <div class="status-text" id="status">Initialisation de la base de données locale...</div>
    </div>

    <script>
        // Optionnel : petite simulation de messages d'étape pour rendre l'attente fluide
        const statusSteps = [
            "Initialisation de la base de données locale...",
            "Vérification des services mDNS (wiwitrack.local)...",
            "Chargement des modules du secrétariat...",
            "Prêt !"
        ];

        let step = 0;
        setInterval(() => {
            step = (step + 1) % statusSteps.length;
            const el = document.getElementById('status');
            if (el) el.innerText = statusSteps[step];
        }, 1200);
    </script>
</body>

</html>
